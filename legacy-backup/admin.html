<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de Administración</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="container admin-header__inner">
      <strong class="admin-brand">Panel de Administración</strong>
      <nav class="admin-nav">
        <a href="index.html" class="btn btn--ghost">← Ver tienda</a>
        <button class="btn btn--ghost" id="logout-btn" type="button">Salir</button>
      </nav>
    </div>
  </header>

  <main class="container admin-wrap">

    <div class="admin-tabs" id="admin-tabs">
      <button class="admin-tab active" data-tab="productos">Productos</button>
      <button class="admin-tab" data-tab="config">Configuración</button>
      <button class="admin-tab" data-tab="cupones">Cupones</button>
    </div>

    <section class="admin-panel active" id="panel-productos">
      <div class="admin-bar">
        <h2>Productos <span class="admin-count" id="product-count"></span></h2>
        <button class="btn btn--primary" id="add-product-btn">+ Nuevo producto</button>
      </div>
      <div class="admin-list" id="product-list"></div>
      <p class="admin-empty hidden" id="product-empty">Aún no hay productos. Crea el primero.</p>
    </section>

    <section class="admin-panel" id="panel-config">
      <h2>Configuración de la tienda</h2>
      <form id="config-form" class="admin-form" autocomplete="off">
        <label class="field">
          <span>Nombre de la marca</span>
          <input type="text" name="brand" required>
        </label>
        <label class="field">
          <span>WhatsApp (con código de país, sin +)</span>
          <input type="text" name="whatsapp" placeholder="59171234567" required>
        </label>
        <label class="field">
          <span>Moneda</span>
          <input type="text" name="currency" placeholder="Bs" required>
        </label>
        <button type="submit" class="btn btn--primary">Guardar configuración</button>
        <p class="admin-save-msg hidden" id="config-saved">✓ Configuración guardada</p>
      </form>
    </section>

    <section class="admin-panel" id="panel-cupones">
      <h2>Cupones de descuento</h2>
      <form id="coupon-form" class="admin-form" autocomplete="off">
        <div class="admin-form__row">
          <label class="field">
            <span>Código</span>
            <input type="text" name="code" placeholder="STREET10" required>
          </label>
          <label class="field">
            <span>Tipo</span>
            <select name="type">
              <option value="percent">Porcentaje (%)</option>
              <option value="fixed">Monto fijo</option>
            </select>
          </label>
          <label class="field">
            <span>Valor</span>
            <input type="number" name="value" min="0" step="0.1" required>
          </label>
        </div>
        <button type="submit" class="btn btn--primary">Agregar cupón</button>
      </form>
      <div class="admin-list" id="coupon-list"></div>
    </section>

  </main>

  <div class="modal hidden" id="product-modal" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
    <div class="modal__content modal__content--wide">
      <div class="modal__head">
        <h3 id="product-modal-title">Nuevo producto</h3>
        <button class="icon-btn" id="product-close" aria-label="Cerrar">&times;</button>
      </div>
      <form id="product-form" class="admin-form" autocomplete="off">
        <input type="hidden" name="id">
        <div class="admin-grid">
          <label class="field">
            <span>Nombre</span>
            <input type="text" name="name" required>
          </label>
          <label class="field">
            <span>Marca</span>
            <input type="text" name="brand" required>
          </label>
          <label class="field">
            <span>Categoría</span>
            <input type="text" name="category" list="cat-list" required>
            <datalist id="cat-list"></datalist>
          </label>
          <label class="field">
            <span>Precio (Bs)</span>
            <input type="number" name="price" min="0" step="0.1" required>
          </label>
          <label class="field">
            <span>Precio anterior (opcional)</span>
            <input type="number" name="oldPrice" min="0" step="0.1">
          </label>
          <label class="field">
            <span>Etiqueta</span>
            <select name="badge">
              <option value="">— Ninguna —</option>
              <option value="nuevo">Nuevo</option>
              <option value="agotado">Agotado</option>
            </select>
          </label>
          <label class="field field--full">
            <span>Imagen (URL de internet, opcional)</span>
            <input type="url" name="image" placeholder="https://ejemplo.com/foto.jpg">
          </label>
          <label class="field field--full">
            <span>Descripción</span>
            <textarea name="desc" rows="2"></textarea>
          </label>
          <label class="field field--full">
            <span>Tallas (separadas por coma)</span>
            <input type="text" name="sizes" placeholder="S, M, L, XL">
          </label>
          <div class="field field--full">
            <span>Colores</span>
            <div id="color-rows"></div>
            <button type="button" class="btn btn--ghost" id="add-color-btn">+ Agregar color</button>
          </div>
          <div class="field field--full">
            <span>Vista previa</span>
            <img id="product-preview" alt="Vista previa" width="120" height="120">
          </div>
        </div>
        <div class="admin-actions">
          <button type="button" class="btn btn--ghost" id="product-cancel">Cancelar</button>
          <button type="submit" class="btn btn--primary">Guardar producto</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
